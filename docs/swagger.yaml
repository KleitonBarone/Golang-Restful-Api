basePath: /
definitions:
  main.album:
    properties:
      artist:
        type: string
      id:
        type: string
      price:
        type: number
      title:
        type: string
    type: object
  main.errorResponse:
    properties:
      message:
        type: string
    type: object
  main.healthResponse:
    properties:
      status:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: A simple RESTful API for managing albums
  title: Albums API
  version: "1.0"
paths:
  /albums:
    get:
      description: Get all albums in the collection
      parameters:
      - description: Maximum number of albums to return
        in: query
        minimum: 1
        name: limit
        type: integer
      - description: Number of albums to skip
        in: query
        minimum: 0
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/main.album'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/main.errorResponse'
      summary: List all albums
      tags:
      - albums
    post:
      consumes:
      - application/json
      description: Add a new album to the collection
      parameters:
      - description: Album to create
        in: body
        name: album
        required: true
        schema:
          $ref: '#/definitions/main.album'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          headers:
            Location:
              description: Canonical URL of the created album
              type: string
          schema:
            $ref: '#/definitions/main.album'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/main.errorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/main.errorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/main.errorResponse'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/main.errorResponse'
      summary: Create an album
      tags:
      - albums
  /albums/{id}:
    delete:
      description: Remove an album from the collection by its ID
      parameters:
      - description: Album ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/main.errorResponse'
      summary: Delete an album
      tags:
      - albums
    get:
      description: Get a single album by its ID
      parameters:
      - description: Album ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.album'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get an album by ID
      tags:
      - albums
    put:
      consumes:
      - application/json
      description: Replace an existing album while retaining its ID
      parameters:
      - description: Album ID
        in: path
        name: id
        required: true
        type: string
      - description: Replacement album
        in: body
        name: album
        required: true
        schema:
          $ref: '#/definitions/main.album'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.album'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/main.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/main.errorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/main.errorResponse'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/main.errorResponse'
      summary: Update an album
      tags:
      - albums
  /health:
    get:
      description: Report whether the service process is ready to handle requests
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.healthResponse'
      summary: Check service health
      tags:
      - health
swagger: "2.0"
