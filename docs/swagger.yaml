basePath: /
definitions:
  main.album:
    properties:
      artist:
        description: Artist must contain at least one non-whitespace character.
        minLength: 1
        type: string
      id:
        description: ID must contain at least one non-whitespace character. The values
          "." and ".." are reserved.
        minLength: 1
        type: string
      price:
        description: Price must be greater than zero.
        type: number
      title:
        description: Title must contain at least one non-whitespace character.
        minLength: 1
        type: string
    required:
    - artist
    - id
    - price
    - title
    type: object
  main.albumPatch:
    properties:
      artist:
        description: Artist, when supplied, must contain at least one non-whitespace
          character.
        minLength: 1
        type: string
      price:
        description: Price, when supplied, must be greater than zero.
        type: number
      title:
        description: Title, when supplied, must contain at least one non-whitespace
          character.
        minLength: 1
        type: string
    type: object
  main.errorResponse:
    properties:
      message:
        type: string
    type: object
  main.healthResponse:
    properties:
      status:
        type: string
    type: object
info:
  contact: {}
  description: A simple RESTful API for managing albums
  title: Albums API
  version: "1.0"
paths:
  /albums:
    get:
      description: Get all albums in the collection. Limit and offset can each be
        specified once.
      parameters:
      - description: Maximum number of albums to return
        in: query
        minimum: 1
        name: limit
        type: integer
      - description: Number of albums to skip
        in: query
        minimum: 0
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          headers:
            X-Total-Count:
              description: Total number of albums when pagination is requested
              type: integer
          schema:
            items:
              $ref: '#/definitions/main.album'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/main.errorResponse'
      summary: List all albums
      tags:
      - albums
    head:
      description: Get all albums in the collection. Limit and offset can each be
        specified once.
      parameters:
      - description: Maximum number of albums to return
        in: query
        minimum: 1
        name: limit
        type: integer
      - description: Number of albums to skip
        in: query
        minimum: 0
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          headers:
            X-Total-Count:
              description: Total number of albums when pagination is requested
              type: integer
          schema:
            items:
              $ref: '#/definitions/main.album'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/main.errorResponse'
      summary: List all albums
      tags:
      - albums
    post:
      consumes:
      - application/json
      description: |-
        Add a new album to the collection.
        Requires Content-Type: application/json; media type parameters are accepted. The complete body, including trailing whitespace or data, must not exceed 64 KiB.
        Send exactly one JSON object. Malformed JSON, unknown fields, duplicate fields under Unicode case folding, invalid UTF-8, and unpaired Unicode surrogate escapes are rejected with 400. Rejected requests leave stored albums unchanged.
      parameters:
      - description: Album to create
        in: body
        name: album
        required: true
        schema:
          $ref: '#/definitions/main.album'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          headers:
            Location:
              description: Canonical URL of the created album
              type: string
          schema:
            $ref: '#/definitions/main.album'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/main.errorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/main.errorResponse'
        "413":
          description: Request body exceeds 64 KiB
          schema:
            $ref: '#/definitions/main.errorResponse'
        "415":
          description: Missing, malformed, or unsupported Content-Type; application/json
            is required
          schema:
            $ref: '#/definitions/main.errorResponse'
      summary: Create an album
      tags:
      - albums
  /albums/{id}:
    delete:
      description: Remove an album from the collection by its ID
      parameters:
      - description: Album ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/main.errorResponse'
      summary: Delete an album
      tags:
      - albums
    get:
      description: Get a single album by its ID
      parameters:
      - description: Album ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.album'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/main.errorResponse'
      summary: Get an album by ID
      tags:
      - albums
    head:
      description: Get a single album by its ID
      parameters:
      - description: Album ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.album'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/main.errorResponse'
      summary: Get an album by ID
      tags:
      - albums
    patch:
      consumes:
      - application/json
      description: |-
        Update selected fields of an existing album while retaining its ID. Explicit null fields are rejected.
        Requires Content-Type: application/json; media type parameters are accepted. The complete body, including trailing whitespace or data, must not exceed 64 KiB.
        Send exactly one JSON object. Malformed JSON, unknown fields, duplicate fields under Unicode case folding, invalid UTF-8, and unpaired Unicode surrogate escapes are rejected with 400. Rejected requests leave stored albums unchanged.
      parameters:
      - description: Album ID
        in: path
        name: id
        required: true
        type: string
      - description: Album fields to update
        in: body
        name: album
        required: true
        schema:
          $ref: '#/definitions/main.albumPatch'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.album'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/main.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/main.errorResponse'
        "413":
          description: Request body exceeds 64 KiB
          schema:
            $ref: '#/definitions/main.errorResponse'
        "415":
          description: Missing, malformed, or unsupported Content-Type; application/json
            is required
          schema:
            $ref: '#/definitions/main.errorResponse'
      summary: Partially update an album
      tags:
      - albums
    put:
      consumes:
      - application/json
      description: |-
        Replace an existing album while retaining its ID.
        Requires Content-Type: application/json; media type parameters are accepted. The complete body, including trailing whitespace or data, must not exceed 64 KiB.
        Send exactly one JSON object. Malformed JSON, unknown fields, duplicate fields under Unicode case folding, invalid UTF-8, and unpaired Unicode surrogate escapes are rejected with 400. Rejected requests leave stored albums unchanged.
      parameters:
      - description: Album ID
        in: path
        name: id
        required: true
        type: string
      - description: Replacement album
        in: body
        name: album
        required: true
        schema:
          $ref: '#/definitions/main.album'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.album'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/main.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/main.errorResponse'
        "413":
          description: Request body exceeds 64 KiB
          schema:
            $ref: '#/definitions/main.errorResponse'
        "415":
          description: Missing, malformed, or unsupported Content-Type; application/json
            is required
          schema:
            $ref: '#/definitions/main.errorResponse'
      summary: Update an album
      tags:
      - albums
  /health:
    get:
      description: Report whether the service process is ready to handle requests
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.healthResponse'
      summary: Check service health
      tags:
      - health
    head:
      description: Report whether the service process is ready to handle requests
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.healthResponse'
      summary: Check service health
      tags:
      - health
swagger: "2.0"
